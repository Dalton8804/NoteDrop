name: Release (signed + notarized)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - run: npm ci

      - name: Write App Store Connect API key
        run: echo "${{ secrets.APPLE_API_KEY_B64 }}" | base64 --decode > "$RUNNER_TEMP/authkey.p8"

      - name: Build, sign & notarize
        env:
          APPLE_API_KEY: ${{ runner.temp }}/authkey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run make -- --arch="arm64,x64"

      - name: Notarize & staple the DMG
        env:
          KEY: ${{ runner.temp }}/authkey.p8
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          find out/make -name '*.dmg' -print0 | while IFS= read -r -d '' dmg; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" --key "$KEY" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Rename DMGs to stable, version-less filenames
        run: |
          find out/make -name '*.dmg' -print0 | while IFS= read -r -d '' dmg; do
            case "$dmg" in
              *arm64*) mv "$dmg" out/make/NoteDrop-macos-arm64.dmg ;;
              *x64*|*x86_64*) mv "$dmg" out/make/NoteDrop-macos-x64.dmg ;;
            esac
          done

      - name: Upload build artifacts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: NoteDrop-macos
          path: out/make/**

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/make/NoteDrop-macos-arm64.dmg
            out/make/NoteDrop-macos-x64.dmg
            out/make/**/*.zip
